name: Deploy to Server

on:
  workflow_run:
    workflows: ["Build & Push to GHCR"]
    types:
      - completed
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Logging in to GitHub Container Registry..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "Pulling the latest image..."
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest
            
            echo "Stopping and removing the old container..."
            docker stop openappo-admin || true
            docker rm openappo-admin || true
            
            echo "Ensuring volume folder exists with write permissions..."
            mkdir -p /opt/openappo-admin/data
            chmod 777 /opt/openappo-admin/data
            
            echo "Running the new container..."
            docker run -d \
              --name openappo-admin \
              --restart unless-stopped \
              -p 3010:3010 \
              -v /opt/openappo-admin/data:/app/data \
              --env-file /opt/openappo-admin/.env \
              ghcr.io/${{ env.IMAGE_NAME }}:latest
              
            echo "Running database migrations..."
            docker exec openappo-admin npx prisma db push --accept-data-loss
            
            echo "Seeding default data if needed..."
            docker exec openappo-admin node prisma/seed.js
            
            echo "Cleaning up old images..."
            docker image prune -f
